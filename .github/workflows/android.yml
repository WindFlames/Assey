name: Android CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 不再使用 android-actions/setup-android：它在新版 cmdline-tools 上会因
      # 安装已下线的 "tools" 包而失败。runner 已自带 SDK，直接调用 sdkmanager。
      - name: Install SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ASSEY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ASSEY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASSEY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASSEY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::未配置 ASSEY_KEYSTORE_BASE64，release APK 将使用 debug 签名。"
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::签名 secrets 不完整，需要 ASSEY_KEYSTORE_PASSWORD / ASSEY_KEY_ALIAS / ASSEY_KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assey-release.jks"
          {
            echo "ASSEY_KEYSTORE_FILE=$RUNNER_TEMP/assey-release.jks"
            echo "ASSEY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ASSEY_KEY_ALIAS=$KEY_ALIAS"
            echo "ASSEY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK
        env:
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          ARGS=""
          if [ -n "$TAG_NAME" ]; then
            ARGS="-PappVersionName=${TAG_NAME#v} -PappVersionCode=${{ github.run_number }}"
          fi
          ./gradlew :app:assembleRelease $ARGS --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: assey-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: assey-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: assey-release
          path: dist

      - name: Rename APK with version
        run: |
          set -euo pipefail
          APK=$(find dist -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          mv "$APK" "dist/Assey-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Assey ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Assey-*.apk
          fail_on_unmatched_files: true
