name: Release

# 只做 release：打 tag 自动发版，或手动跑一次拿 APK 自测。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本名，如 1.2.0（留空 = 1.0.<run_number>）"
        required: false
      version_code:
        description: "版本号，正整数（留空 = run_number）"
        required: false

permissions:
  contents: read

# 同一个 tag 只允许一条流水线，且发布中途不取消（避免上传到一半）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # SDK 平台/构建工具装一次就固定了，缓存掉可以省下每次几分钟的下载
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: android-sdk-${{ runner.os }}-37.2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      # 仓库在 Windows 上提交过 gradlew，Git 里是可执行位丢失的 100644
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 缓存：~/.gradle/caches 里的依赖与构建缓存，key 由 build 脚本/lock 文件算出。
      # tag 构建也要写缓存（默认 PR 上是只读），否则每次 tag 都要冷启动。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
          # 只缓存依赖和 build-cache，不缓存 project 目录下的临时产物
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      # R8 的 release 收缩阶段很吃堆：关掉 packageScope 后 R8 要处理整个应用
      # （几万个类，含 openai-java 与 Jackson），4g 实测仍会 OOM，这里给到 8g。
      # 直接改 checkout 出来的 gradle.properties，不去赌 GRADLE_USER_HOME 的优先级规则。
      - name: Raise Gradle heap for R8
        shell: bash
        run: |
          set -euo pipefail
          LINE="org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          sed -i "s|^org\.gradle\.jvmargs=.*|$LINE|" gradle.properties
          grep -n '^org\.gradle\.jvmargs=' gradle.properties

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_NAME: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${INPUT_NAME:-1.0.${GITHUB_RUN_NUMBER}}"
          fi
          CODE="${INPUT_CODE:-${GITHUB_RUN_NUMBER}}"
          if [[ ! "${CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code 必须是正整数，收到：${CODE}"
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "版本：${NAME} (${CODE})"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ASSEY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ASSEY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASSEY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASSEY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::缺少签名密钥：请在仓库 Secrets 配置 ASSEY_KEYSTORE_BASE64（keystore 的 base64）"
            exit 1
          fi
          if [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::签名 secrets 不完整，需要 ASSEY_KEYSTORE_PASSWORD / ASSEY_KEY_ALIAS / ASSEY_KEY_PASSWORD"
            exit 1
          fi
          STORE="$GITHUB_WORKSPACE/assey-release.jks"
          echo "${KEYSTORE_BASE64}" | base64 -d > "$STORE"
          # 先验一遍密码/别名，别等打完包才发现签名配置错
          keytool -list -keystore "$STORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          {
            # 传相对路径：build.gradle.kts 里是 rootProject.file(storePath)
            echo "ASSEY_KEYSTORE_FILE=assey-release.jks"
            echo "ASSEY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ASSEY_KEY_ALIAS=$KEY_ALIAS"
            echo "ASSEY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PappVersionName='${{ steps.version.outputs.name }}' \
            -PappVersionCode='${{ steps.version.outputs.code }}' \
            -Pandroid.builder.sdkDownload=true \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          [[ -n "${APK}" ]] || { echo "::error::没有生成 release APK"; exit 1; }
          ls -lh "${APK}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER=$(find "${SDK}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [[ -n "${APKSIGNER}" ]]; then
            "${APKSIGNER}" verify --print-certs "${APK}"
          else
            echo "::notice::未找到 apksigner，跳过签名校验"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: assey-release-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: assey-release-${{ needs.build.outputs.version_name }}
          path: dist

      - name: Rename & checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          [[ -n "${APK}" ]] || { echo "::error::构件里没有 APK"; exit 1; }
          mv "${APK}" "dist/Assey-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Assey ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Assey-*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
